# Pushing a vX.Y.Z (or vX.Y.Z-pre.N) tag that matches package.json releases that commit: the full CI runs
# first (it is called below), and only the .vsix that CI built and tested is attached to the GitHub Release.
name: Release

on:
    push:
        tags: ['v*.*.*']

permissions:
    contents: read

concurrency:
    # one release per tag at a time; never cancel a release half way
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    tag:
        name: Check tag and version
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.info.outputs.version }}
            prerelease: ${{ steps.info.outputs.prerelease }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - id: info
              run: node scripts/release-info.mjs "$GITHUB_REF_NAME"

    ci:
        name: CI
        needs: tag
        uses: ./.github/workflows/ci.yml

    github-release:
        name: GitHub Release
        needs: [tag, ci]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            TAG: ${{ github.ref_name }}
            VERSION: ${{ needs.tag.outputs.version }}
            PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # the package the CI jobs of this run built and tested
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: vsix
                  path: release
            - name: Verify package and write checksum
              run: |
                  vsix="latex-sync-follow-$VERSION.vsix"
                  node scripts/verify-vsix.mjs "release/$vsix" --version "$VERSION"
                  (cd release && sha256sum "$vsix" > "$vsix.sha256" && cat "$vsix.sha256")
            - name: Refuse to replace an existing release
              run: |
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                    echo "::error::Release $TAG already exists. Delete it or tag a new version."
                    exit 1
                  fi
            - name: Create release
              run: |
                  node scripts/release-info.mjs "$TAG" --notes notes.md
                  kind=--latest
                  if [ "$PRERELEASE" = true ]; then kind=--prerelease; fi
                  gh release create "$TAG" release/*.vsix release/*.sha256 --repo "$GITHUB_REPOSITORY" \
                    --verify-tag --title "$TAG" --notes-file notes.md --generate-notes "$kind"

    marketplaces:
        name: Publish to Marketplace / Open VSX
        needs: [tag, github-release]
        # opt-in: set the repository variable PUBLISH_MARKETPLACE=true and the secrets below; stable versions only
        if: vars.PUBLISH_MARKETPLACE == 'true' && needs.tag.outputs.prerelease == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: marketplace
        env:
            VSCE_PAT: ${{ secrets.VSCE_PAT }}
            OVSX_PAT: ${{ secrets.OVSX_PAT }}
            VERSION: ${{ needs.tag.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            # tokens are in this job's environment: install the pinned publishers without running package scripts
            - name: Install publishing tools
              run: npm ci --ignore-scripts
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: vsix
                  path: release
            - name: Visual Studio Marketplace
              if: env.VSCE_PAT != ''
              run: npx vsce publish --packagePath "release/latex-sync-follow-$VERSION.vsix"
            - name: Open VSX
              if: env.OVSX_PAT != ''
              run: npx ovsx publish "release/latex-sync-follow-$VERSION.vsix"
